[Service]
# Pre failure cancels suspend. Post is outside systemd-sleep's device callbacks.
ExecStartPre=/usr/local/sbin/mbp-t1-s3-handshake pre
ExecStartPost=/usr/local/sbin/mbp-t1-s3-handshake post
# Recover if systemd-sleep fails after the pre-call. Consumed marker prevents repeats.
ExecStopPost=/usr/local/sbin/mbp-t1-s3-handshake post
